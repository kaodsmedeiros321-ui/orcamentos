<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="orcamentos.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="app-icon-192.png">
<link rel="apple-touch-icon" href="app-icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MTM e Alves">
<title>MTM · Orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra lateral preta (mesmo fundo da logo) + área de trabalho clara; azul da logo como cor de ação */
:root{
  --black:#000; --coal:#141517; --coal-2:#1E2023; --coal-3:#2C2F34;
  --blue:#004AAD; --blue-2:#0A5CCB; --blue-soft:#E7EEFA; --navy:#063780;
  --bg:#F2F3F5; --white:#fff; --line:#DCDFE4; --ink:#15171A; --muted:#5C626C; --faint:#8D939C;
  --red:#B42318; --red-bg:#FDECEA; --amber:#8A5300; --amber-bg:#FFF2D6; --green:#1C6B45; --green-bg:#E2F3E9; --sky:#0A4FA8; --sky-bg:#E5EEFB;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fc:"Barlow Condensed","Arial Narrow",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--black);color:#D5D8DD;display:flex;flex-direction:column;gap:20px;padding:18px 14px 20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:block;width:176px;margin:0 auto}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:15px;color:#B9BEC6;text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--coal-2);color:#fff}
.nav a[aria-current="page"]{background:var(--blue);color:#fff;font-weight:600}
.nav a:focus-visible{outline:2px solid #6EA0EA;outline-offset:1px}
.side .new{margin:2px 0 0}
.side-foot{margin-top:auto;font-size:12.5px;color:#8D939C;line-height:1.5;border-top:1px solid var(--coal-3);padding:14px 6px 0;display:grid;gap:6px}
.side-foot b{color:#D5D8DD;font-weight:600}
.side-foot .warn{color:#F3B44C}
.main{padding:28px 32px 60px;max-width:1220px;width:100%}

/* ---------- elementos ---------- */
h1{font-family:var(--fc);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1.1}
h2{font-family:var(--fc);font-weight:700;font-size:20px;margin:0 0 12px;letter-spacing:.01em}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:#B9BEC6}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-2)}
.btn.wpp{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn.block{width:100%;justify-content:center}
.btn:focus-visible,.in:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.ico-btn{border:0;background:transparent;border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--faint);font-size:20px;line-height:1}
.ico-btn:hover{background:var(--red-bg);color:var(--red)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.in{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--white);min-height:38px}
input.in,select.in{height:40px}
.in:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(0,74,173,.12)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.num{text-align:right;font-family:var(--fm);font-size:14px}
.field{display:grid;gap:5px;align-content:start}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field small{color:var(--faint);font-size:12px}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.row-in{display:flex;gap:8px}
.muted{color:var(--muted)}
.notice{border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.demo{background:var(--sky-bg);color:#123B73;border:1px solid #C7D8F3}
.notice.warn{background:var(--amber-bg);color:#5C3A00;border:1px solid #F0D69E}

/* ---------- status ---------- */
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.blue{background:var(--sky-bg);color:var(--sky)}
.pill.gray{background:#ECEEF1;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- painel ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.kpi .v{font-family:var(--fc);font-size:32px;font-weight:700;line-height:1.1;margin-top:6px}
.kpi .s{font-size:13px;color:var(--muted);font-family:var(--fm)}
.kpi.dark{background:var(--black);border-color:var(--black);color:#fff}
.kpi.dark .l,.kpi.dark .s{color:#9EA4AD}

/* ---------- tabelas ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #ECEEF1;vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#F7F8FA}
.tbl .r{text-align:right}
.show-m{display:none}
.tbl .t2{font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.mini-list{display:grid}
.mini-list a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 4px;border-bottom:1px solid #ECEEF1;color:inherit;text-decoration:none;align-items:center}
.mini-list a:hover{background:#F7F8FA}
.mini-list .n{font-family:var(--fm);font-size:13px;color:var(--muted)}
.mini-list .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-list .c small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.mini-list .v{text-align:right;font-family:var(--fm);font-size:14px}
.mini-list .v small{display:block}

/* ---------- editor ---------- */
.back{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;display:inline-block;margin-bottom:6px}
.back:hover{color:var(--blue)}
.saved{font-size:13px;color:var(--faint);transition:color .3s}
.saved.on{color:var(--green)}
.it-head,.it-row{display:grid;grid-template-columns:130px minmax(0,1fr) 78px 70px 112px 116px 34px;grid-template-areas:"tipo desc qtd un preco tot del";gap:8px;align-items:center}
.it-head{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--line)}
.it-head .r{text-align:right}
.it-row{padding:8px 0;border-bottom:1px solid #ECEEF1}
.it-row [data-k="tipo"]{grid-area:tipo}.it-row [data-k="desc"]{grid-area:desc}.it-row [data-k="qtd"]{grid-area:qtd}
.it-row [data-k="un"]{grid-area:un}.it-row [data-k="preco"]{grid-area:preco}.it-row .tot{grid-area:tot}.it-row [data-del]{grid-area:del}
.it-row .tot{text-align:right;font-family:var(--fm);font-size:14px;font-weight:600}
.it-row.servico{box-shadow:inset 3px 0 0 var(--blue);padding-left:8px}
.it-row.peca{box-shadow:inset 3px 0 0 #7C8592;padding-left:8px}
.it-row.material{box-shadow:inset 3px 0 0 #C08A2E;padding-left:8px}
.it-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.it-sum{margin-left:auto;align-self:center;font-weight:600;color:var(--muted)}
.it-sum b{color:var(--ink);font-size:17px;margin-left:8px}
.it-empty{padding:22px 4px;color:var(--muted);text-align:center;border-bottom:1px solid #ECEEF1}
.totals{display:grid;gap:9px;font-size:15px}
.totals .ln{display:flex;justify-content:space-between;gap:10px;align-items:center}
.totals .ln .mono{font-size:14.5px}
.totals .ln .ctl{display:flex;gap:6px;width:170px}
.totals .ln .ctl .in{min-height:34px;padding:6px 8px}
.totals .ln .ctl select.in{width:62px;flex:none;padding:6px 4px}
.totals hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.totals .big{background:var(--black);color:#fff;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.totals .big span{font-family:var(--fc);font-weight:700;font-size:18px;letter-spacing:.06em}
.totals .big b{font-family:var(--fm);font-size:24px}
.st-sel{font-weight:600;width:auto;min-width:150px}

/* ---------- modal / aviso ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));box-shadow:0 24px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,10,11,.55)}
.mdl header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mdl header h3{margin:0;font-family:var(--fc);font-size:22px}
.mdl-body{padding:18px 20px;max-height:70vh;overflow:auto}
.mdl footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#FAFAFB;border-radius:0 0 14px 14px}
.mdl footer .left{margin-right:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.logo-prev{background:var(--black);border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:center;min-height:120px}
.logo-prev img{max-width:220px;max-height:140px}

/* ---------- celular ---------- */
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-side,.grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:10px;padding:8px 12px;overflow-x:auto}
  .side .logo{width:84px;margin:0;flex:none}
  .nav{display:flex;gap:2px}
  .nav a{padding:8px 10px;font-size:14px;white-space:nowrap}
  .nav a span{display:none}
  .nav a[aria-current="page"] span{display:inline}
  .side .new,.side-foot{display:none}
  .main{padding:18px 16px 60px}
  .fields.c2,.fields.c3{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .it-head{display:none}
  .it-row{grid-template-columns:1fr 1fr 1fr 34px;grid-template-areas:"tipo tipo tipo del" "desc desc desc desc" "qtd un preco preco" "tot tot tot tot";padding:12px 0 12px 10px}
  .tbl .hide-m{display:none}
  .tbl .show-m{display:block;margin-top:4px}
  .card{padding:16px 14px}
  .tbl td,.tbl th{padding:9px 6px}
}

/* ---------- impressão / PDF ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:9mm 10mm}
  html,body{background:#fff;height:auto}
  .app,.toast,dialog{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pv{font-family:var(--f);color:#111;font-size:10.5pt;line-height:1.38}
.pv-top{background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px 10px 10px;border-radius:6px}
.pv-top img{height:92px;display:block}
.pv-top .t{text-align:right}
.pv-top .t .l{font-family:var(--fc);font-weight:700;font-size:26pt;letter-spacing:.08em;line-height:1}
.pv-top .t .n{font-family:var(--fm);font-size:13pt;color:#7FB0F5;margin-top:4px}
.pv-top .t .d{font-size:9.5pt;color:#C9CDD3;margin-top:4px}
.pv-emp{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:9pt;color:#333;padding:7px 4px 9px;border-bottom:2.5px solid var(--blue)}
.pv-emp b{color:#000}
.pv-boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pv-box{border:1px solid #CFD3D9;border-radius:6px;padding:8px 11px}
.pv-box .h{font-family:var(--fc);font-weight:700;font-size:10pt;letter-spacing:.1em;color:var(--blue);margin-bottom:3px}
.pv-box .big{font-weight:700;font-size:11.5pt}
.pv-box div{font-size:9.6pt}
.pv table{width:100%;border-collapse:collapse;font-size:9.8pt}
.pv th{background:#111;color:#fff;font-weight:600;font-size:8.6pt;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;text-align:left}
.pv th.r,.pv td.r{text-align:right}
.pv td{padding:5px 8px;border-bottom:1px solid #E3E5E9;vertical-align:top}
.pv td.m{font-family:var(--fm);font-size:9.2pt;white-space:nowrap}
.pv tr.grp td{background:#EEF3FB;font-family:var(--fc);font-weight:700;letter-spacing:.08em;font-size:9.5pt;color:var(--navy);padding:4px 8px}
.pv tr.sub td{font-weight:600;background:#FAFAFB}
.pv-bottom{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;margin-top:12px;align-items:start;break-inside:avoid}
.pv-tot{border:1px solid #CFD3D9;border-radius:6px;overflow:hidden}
.pv-tot .ln{display:flex;justify-content:space-between;padding:5px 11px;font-size:9.8pt;border-bottom:1px solid #EEF0F2}
.pv-tot .ln span:last-child{font-family:var(--fm)}
.pv-tot .total{background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:baseline;padding:9px 11px}
.pv-tot .total span{font-family:var(--fc);font-weight:700;letter-spacing:.08em;font-size:12pt}
.pv-tot .total b{font-family:var(--fm);font-size:14pt}
.pv-cond .h{font-family:var(--fc);font-weight:700;font-size:10pt;letter-spacing:.1em;color:var(--blue);margin:0 0 2px}
.pv-cond p{margin:0 0 9px;font-size:9.6pt;white-space:pre-line}
.pv-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px;break-inside:avoid}
.pv-sign div{border-top:1px solid #333;padding-top:5px;text-align:center;font-size:9.2pt}
.pv-sign small{display:block;color:#666;font-size:8.4pt}
.pv-foot{margin-top:18px;text-align:center;font-size:8pt;color:#888}

/* ---------- app (PWA): troca de empresa, backup, enviar PDF ---------- */
.troca{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:1px dashed rgba(255,255,255,.3);color:inherit;text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.2}
.troca:hover{background:rgba(255,255,255,.08)}
.troca img{width:24px;height:24px;border-radius:6px;flex:none;display:block}
.troca small{display:block;font-size:11.5px;opacity:.7;font-weight:500}
.notice.bk{background:#FFF2CC;color:#5C3A00;border:1.5px solid #F0C75E}
.notice.bk .btn{background:#fff}
.pdfbox{position:fixed;left:-10000px;top:0;width:760px;background:#fff;padding:0}
.bk-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.bk-stat div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bk-stat b{display:block;font-size:22px;line-height:1.1}
.bk-stat span{font-size:12.5px;color:var(--muted)}
.bk-steps{margin:0;padding-left:20px;display:grid;gap:8px}
.bk-last{font-weight:700}
.bk-last.warn{color:#9A5B00}
.bk-last.ok{color:#1C6B45}
@media (max-width:860px){
  .ed-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:8px}
  .ed-actions>*{justify-content:center}
  .ed-actions .st-sel{grid-column:1/-1;width:100%}
  .ed-actions #b-send{grid-column:1/-1;padding:13px 14px;font-size:16px}
  .ed-actions #b-wpp,.ed-actions #b-pdf{grid-column:span 2}
  .ed-actions #b-dup,.ed-actions #b-del{grid-column:span 2;padding:6px 10px;font-size:13.5px}
  .bk-stat b{font-size:19px}
  .main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .side{overflow:visible}
  .nav{overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .troca{flex:none;padding:5px;border:1.5px solid rgba(255,255,255,.4)}
  .troca span{display:none}
  .troca img{width:30px;height:30px}
  .kpi .v{font-size:clamp(18px,5.4vw,32px);white-space:nowrap}
}

/* ---------- produtos ---------- */
:root{--pa:var(--blue);--pbg:#EEF2F8}
.cat-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cat-bar #q{flex:1 1 240px;max-width:440px}
.cat-bar select.in{width:auto;flex:0 1 230px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto;flex:none}
.seg button{border:0;background:var(--white);padding:8px 13px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;background:var(--white);transition:border-color .15s,transform .15s}
.pcard:hover,.pcard:focus-visible{border-color:var(--pa);transform:translateY(-2px);outline:none}
.pcard.off{opacity:.55}
.pimg{aspect-ratio:4/3;background:var(--pbg);display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg span{font-size:36px;font-weight:700;color:var(--pa);opacity:.5;font-family:var(--fc);letter-spacing:.02em}
.pbody{padding:10px 12px 12px;display:grid;gap:5px;align-content:start}
.pn{font-weight:700;line-height:1.25}
.pm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.pp{font-family:var(--fm);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.pp small{font-weight:500;color:var(--muted);font-size:12px}
.ps{font-size:12px;color:var(--faint);line-height:1.4}
.ps .low{color:var(--red);font-weight:700}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--pbg);display:grid;place-items:center;font-weight:700;color:var(--pa);font-size:14px}
.p-foto{aspect-ratio:1;border-radius:12px;background:var(--pbg);display:grid;place-items:center;overflow:hidden;border:1.5px dashed var(--line);margin-bottom:12px}
.p-foto img{width:100%;height:100%;object-fit:cover;display:block}
.p-foto span{color:var(--muted);font-size:14px;text-align:center;padding:16px}
.ex-row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) 34px;gap:8px;margin-bottom:8px;align-items:center}
.ex-sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ex-sug .chip{font-size:12.5px;padding:4px 10px}
.p-mg{border-radius:10px;background:var(--pbg);padding:10px 12px;font-size:14px;margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.p-mg b{font-family:var(--fm);font-variant-numeric:tabular-nums}
.p-calc{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.p-calc h3{margin:0 0 10px;font-size:15px;font-family:var(--fc)}
.p-calc .hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.pcheck{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:600;margin-top:10px;line-height:1.35;cursor:pointer}
.pcheck input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--pa)}
.pv td img.pv-ft{width:34px;height:34px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:8px}
@media (max-width:860px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pp{font-size:15.5px}
  .seg{margin-left:0}
  .cat-bar select.in{flex:1 1 100%}
}

/* ---------- cotação formal (empresas) ---------- */
.formal-card .formal-on{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:700}
.formal-card .formal-on input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--pa);flex:none}
.formal-card .formal-on small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.formal-card .fields{margin-top:16px}
.pv td.it{font-family:var(--fm);font-size:8.8pt;color:#666;white-space:nowrap}
.pv td.cd{font-family:var(--fm);font-size:8.6pt;white-space:nowrap}
.pv .pv-fml{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:9.4pt;margin:0 0 9px}
.pv .pv-fml b{font-weight:700}

/* ---------- celular: produto prático ---------- */
.p-savebar{display:none}
@media (max-width:860px){
  #f-prod>.stack:last-child{order:-1}
  #f-prod .p-foto{aspect-ratio:4/3}
  .p-savebar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--white);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
  .p-savebar .btn{flex:1;justify-content:center;padding:13px;font-size:16px}
  body.has-savebar .main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.has-savebar .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .head .actions .btn[form="f-prod"]{display:none}
}
@media (max-width:860px){.cat-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-2px;padding:2px}.cat-chips::-webkit-scrollbar{display:none}.cat-chips .chip{flex:none}.cat-bar #q{flex-basis:100%}}

/* ---------- escolher produto no orçamento ---------- */
.pk-top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pk-top .in{flex:1 1 200px}
.pk-list{display:grid;gap:2px}
.pk-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 6px;border-radius:10px;border:0;background:transparent;text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.pk-row:hover,.pk-row:focus-visible{background:var(--pbg);outline:none}
.pk-row .thumb{width:48px;height:48px}
.pk-row .n,.pk-row .s{display:block}
.pk-row .n{font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.pk-row .s{font-size:12.5px;color:var(--muted)}
.pk-row .p{font-family:var(--fm);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pk-row .p small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.pk-row.ok .p::after{content:"✓ adicionado";display:block;font-size:11.5px;color:var(--green-ink,var(--green));font-weight:700}
.pk-count{margin-right:auto;align-self:center;font-weight:700;color:var(--muted);font-size:14px}
.it-add .add-cat{order:-1}

/* ---------- celular: menu na lateral esquerda ---------- */
.nav a span i{font-style:normal}
@media (max-width:860px){
  .app{grid-template-columns:68px minmax(0,1fr)}
  .side{position:sticky;top:0;height:100vh;height:100dvh;flex-direction:column;align-items:stretch;gap:10px;padding:10px 5px calc(10px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;border-bottom:0;border-right:1px solid #222}
  .side .logo{width:54px;height:auto;margin:0 auto;flex:none}
  .nav{display:flex;flex-direction:column;gap:4px;overflow:visible;flex:none;min-width:0}
  .nav a{flex-direction:column;gap:4px;padding:9px 2px;font-size:10.5px;text-align:center;line-height:1.1;white-space:normal;border-radius:10px}
  .nav a span{display:block!important}
  .nav a span i{display:none}
  .nav a svg{width:22px;height:22px}
  .troca{margin-top:auto;flex-direction:column;align-items:center;padding:7px 2px;gap:4px;text-align:center;border-style:dashed}
  .troca span{display:block!important;font-size:10px;line-height:1.1}
  .troca small{display:none}
  .troca img{width:30px;height:30px}
  .main{padding:16px 12px calc(60px + env(safe-area-inset-bottom))}
  .p-savebar{left:68px}
  .pk-row{grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px}
  .pk-row .thumb{width:44px;height:44px}
}
</style>
</head>

const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function num(v){if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0}
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtQ=n=>n?n.toLocaleString('pt-BR',{maximumFractionDigits:3,useGrouping:false}):'';
const fmtP=n=>n?n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const dt=s=>s?s.split('-').reverse().join('/'):'—';
const digits=s=>String(s||'').replace(/\D/g,'');
function maskTel(v){const d=digits(v);if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return v}
function maskDoc(v){const d=digits(v);if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return v}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms)}

const cli=id=>S.clientes.find(c=>c.id===id);

function calc(o){let mo=0,pc=0;for(const i of o.itens){const t=r2(num(i.qtd)*num(i.preco));if(i.tipo==='servico')mo+=t;else pc+=t}mo=r2(mo);pc=r2(pc);const sub=r2(mo+pc);let d=num(o.desconto);if(o.descTipo==='%')d=r2(sub*d/100);const fr=num(o.frete);return{mo,pc,sub,desc:d,frete:fr,total:Math.max(0,r2(sub-d+fr))}}
function vencido(o){return o.status==='aberto'&&diffDays(today(),validoAte(o))<0}
function pill(o){const s=STATUS[o.status]||STATUS.aberto;return vencido(o)?`<span class="pill gray">Vencido</span>`:`<span class="pill ${s.c}">${s.t}</span>`}

/* ================= navegação ================= */
let editingId=null;
const main=$('#main');
window.addEventListener('hashchange',render);
function render(){
  const [v,a]=(location.hash.slice(1)||'painel').split('/');
  if(editingId&&!(v==='orc'&&a===editingId))discardIfEmpty(editingId);
  editingId=null;
  if(v==='novo'){const o=newOrc();location.replace('#orc/'+o.id);return}
  const view=v==='orc'?'orcamentos':v==='produto'?'catalogo':v;
  $$('#nav a').forEach(x=>x.toggleAttribute('aria-current',x.dataset.v===view)&&x.setAttribute('aria-current','page'));
  ({painel:vPainel,orcamentos:vLista,orc:()=>vEditor(a),clientes:vClientes,catalogo:vCatalogo,ajustes:vAjustes,backup:vBackup,produto:()=>vProduto(a)}[v]||vPainel)();
  if(v!=='produto')document.body.classList.remove('has-savebar');
  sideFoot();window.scrollTo(0,0);
}
function sideFoot(){
  $('#side-logo').src=logo();
  const ub=S.cfg.ultimoBackup,dias=ub?diffDays(ub.slice(0,10),today()):null;
  $('#side-foot').innerHTML=`<div>Dados salvos <b>neste aparelho</b>.</div><div class="${dias===null||dias>7?'warn':''}">Último backup: ${ub?dt(ub.slice(0,10)):'nunca'}</div><a href="#backup" style="color:#7FB0F5">Fazer backup</a>`;
}
function head(t,sub,actions=''){return`<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="actions">${actions}</div></div>`}
const BTN_NOVO=`<a href="#novo" class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo orçamento</a>`;
function demoNotice(){return S.cfg.demo?`<div class="notice demo"><span><b>Dados de exemplo.</b> Os dados ficam salvos neste aparelho. Os preços de peças e serviços são só exemplos. Quando for usar de verdade, apague os exemplos em Ajustes.</span><a class="btn sm" href="#ajustes">Ir para Ajustes</a></div>`:''}

/* ================= painel ================= */
function vPainel(){
  const t=today(),ym=t.slice(0,7),mes=MESES[+t.slice(5,7)-1];
  const doMes=S.orcs.filter(o=>o.data.slice(0,7)===ym);
  const sum=a=>a.reduce((s,o)=>s+calc(o).total,0);
  const abertos=S.orcs.filter(o=>o.status==='aberto');
  const aprovMes=doMes.filter(o=>o.status==='aprovado'||o.status==='entregue');
  const decididos=doMes.filter(o=>o.status!=='aberto');
  const taxa=decididos.length?Math.round(aprovMes.length/decididos.length*100):null;
  const espera=[...abertos].sort((a,b)=>validoAte(a).localeCompare(validoAte(b))).slice(0,6);
  const ult=[...S.orcs].sort((a,b)=>(b.ano-a.ano)||(b.num-a.num)).slice(0,6);
  const li=(o,right)=>{const c=cli(o.clienteId);return`<a href="#orc/${o.id}"><span class="n">${numStr(o)}</span><span class="c">${esc(c?.nome||'Sem cliente')}<small>${esc(o.titulo||'—')}</small></span><span class="v">${brl(calc(o).total)}<small>${right}</small></span></a>`};
  main.innerHTML=demoNotice()+bkNotice()+head('Painel',`Resumo de ${mes} de ${t.slice(0,4)}`,BTN_NOVO)+`
  <div class="kpis">
    <div class="kpi dark"><div class="l">Aprovado em ${mes}</div><div class="v">${brl(sum(aprovMes))}</div><div class="s">${aprovMes.length} orçamento(s)</div></div>
    <div class="kpi"><div class="l">Aguardando resposta</div><div class="v">${abertos.length}</div><div class="s">${brl(sum(abertos))}</div></div>
    <div class="kpi"><div class="l">Orçado em ${mes}</div><div class="v">${doMes.length}</div><div class="s">${brl(sum(doMes))}</div></div>
    <div class="kpi"><div class="l">Taxa de aprovação</div><div class="v">${taxa===null?'—':taxa+'%'}</div><div class="s">dos respondidos no mês</div></div>
  </div>
  <div class="grid2">
    <section class="card"><h2>Aguardando resposta</h2><div class="mini-list">${espera.length?espera.map(o=>{const d=diffDays(t,validoAte(o));return li(o,d<0?'<span class="pill gray">Vencido</span>':d===0?'vence hoje':`vence em ${d} dia${d>1?'s':''}`)}).join(''):'<div class="empty">Nenhum orçamento em aberto.</div>'}</div></section>
    <section class="card"><h2>Últimos orçamentos</h2><div class="mini-list">${ult.length?ult.map(o=>li(o,pill(o))).join(''):'<div class="empty">Nenhum orçamento ainda. Clique em “Novo orçamento”.</div>'}</div></section>
  </div>`;
}

/* ================= lista ================= */
const F={q:'',st:'',cli:''};
function vLista(){
  const c=F.cli&&cli(F.cli);
  main.innerHTML=demoNotice()+head('Orçamentos',c?`Cliente: <b>${esc(c.nome)}</b> · <a href="#orcamentos" id="clr-cli">ver todos</a>`:`${S.orcs.length} orçamento(s) no total`,BTN_NOVO)+`
  <section class="card">
    <div class="actions" style="margin-bottom:14px;justify-content:space-between">
      <input class="in" id="q" placeholder="Buscar por número, cliente ou serviço…" value="${esc(F.q)}" style="max-width:360px">
      <div class="chips" id="chips">${[['','Todos'],...Object.entries(STATUS).map(([k,v])=>[k,v.t])].map(([k,t])=>`<button class="chip" data-st="${k}" aria-pressed="${F.st===k}">${t}</button>`).join('')}</div>
    </div>
    <div class="tbl-wrap" id="lst"></div>
  </section>`;
  $('#q').oninput=e=>{F.q=e.target.value;drawList()};
  $('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;F.st=b.dataset.st;$$('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));drawList()};
  const clr=$('#clr-cli');if(clr)clr.onclick=()=>{F.cli=''};
  drawList();
}
function drawList(){
  const q=F.q.trim().toLowerCase();
  const rows=S.orcs.filter(o=>(!F.st||o.status===F.st)&&(!F.cli||o.clienteId===F.cli)&&(!q||[numStr(o),o.titulo,cli(o.clienteId)?.nome].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.ano-a.ano)||(b.num-a.num));
  $('#lst').innerHTML=rows.length?`<table class="tbl"><thead><tr><th>Nº</th><th class="hide-m">Data</th><th>Cliente / serviço</th><th class="r">Total</th><th class="hide-m">Status</th><th class="hide-m"></th></tr></thead><tbody>${rows.map(o=>`
    <tr class="click" data-id="${o.id}"><td class="mono">${numStr(o)}</td><td class="hide-m mono">${dt(o.data)}</td>
    <td>${esc(cli(o.clienteId)?.nome||'Sem cliente')}<div class="t2">${esc(o.titulo||'—')}</div></td>
    <td class="r mono">${brl(calc(o).total)}<div class="show-m">${pill(o)}</div></td><td class="hide-m">${pill(o)}</td>
    <td class="hide-m r"><button class="btn sm" data-pdf="${o.id}" title="Imprimir / salvar PDF">PDF</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum orçamento encontrado.</div>';
  $('#lst').onclick=e=>{const p=e.target.closest('[data-pdf]');if(p){e.stopPropagation();printOrc(S.orcs.find(o=>o.id===p.dataset.pdf));return}const tr=e.target.closest('tr[data-id]');if(tr)location.hash='#orc/'+tr.dataset.id};
}

/* ================= editor ================= */
function newOrc(){
  const y=new Date().getFullYear();
  if(S.cfg.anoNum!==y){S.cfg.anoNum=y;S.cfg.prox=1}
  const o={id:uid(),num:S.cfg.prox++,ano:y,data:today(),validade:num(S.cfg.validade)||15,clienteId:'',status:'aberto',titulo:'',prazo:'',ref:'',itens:[],desconto:0,descTipo:'R$',frete:0,pagamento:S.cfg.pagamento,obs:S.cfg.obs,criado:new Date().toISOString()};
  S.orcs.push(o);save();return o;
}
function discardIfEmpty(id){
  const o=S.orcs.find(x=>x.id===id);
  if(o&&!o.clienteId&&!o.itens.length&&!o.titulo.trim()){S.orcs=S.orcs.filter(x=>x!==o);if(o.ano===S.cfg.anoNum&&o.num===S.cfg.prox-1)S.cfg.prox--;save()}
}
function catOptions(){return`<datalist id="dl-cat">${S.catalogo.filter(c=>c.ativo!==false).map(c=>`<option value="${esc(c.desc)}">${esc(TIPOS[c.tipo])} · ${brl(c.preco)}/${esc(c.un)}</option>`).join('')}</datalist>`}
function cliOptions(sel){return`<option value="">— selecione o cliente —</option>`+[...S.clientes].sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.nome)}</option>`).join('')}
function rowHTML(it,i){return`<div class="it-row ${it.tipo}" data-i="${i}">
  <select class="in" data-k="tipo" aria-label="Tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}"${it.tipo===k?' selected':''}>${v}</option>`).join('')}</select>
  <input class="in" data-k="desc" list="dl-cat" value="${esc(it.desc)}" placeholder="Descrição (digite ou escolha do catálogo)" aria-label="Descrição">
  <input class="in num" data-k="qtd" inputmode="decimal" value="${fmtQ(it.qtd)}" placeholder="Qtd" aria-label="Quantidade">
  <input class="in" data-k="un" list="dl-un" value="${esc(it.un)}" placeholder="Un" aria-label="Unidade">
  <input class="in num" data-k="preco" inputmode="decimal" value="${fmtP(it.preco)}" placeholder="Valor unit." aria-label="Valor unitário">
  <div class="tot">${brl(r2(num(it.qtd)*num(it.preco)))}</div>
  <button class="ico-btn" data-del title="Remover item" aria-label="Remover item">×</button></div>`}

function vEditor(id){
  const o=S.orcs.find(x=>x.id===id);
  if(!o){main.innerHTML=head('Orçamento não encontrado','',`<a class="btn" href="#orcamentos">Voltar</a>`);return}
  editingId=id;
  main.innerHTML=catOptions()+`
  <a class="back" href="#orcamentos">← Orçamentos</a>
  <div class="head"><div><h1>Orçamento <span class="mono">${numStr(o)}</span></h1><p><span class="saved" id="saved">Salvo automaticamente</span></p></div>
    <div class="actions ed-actions">
      <select class="in st-sel" id="st" aria-label="Status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${o.status===k?' selected':''}>${v.t}</option>`).join('')}</select>
      <button class="btn primary" id="b-send"><svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>Enviar PDF</button>
      <button class="btn" id="b-pdf"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg>Imprimir</button>
      <button class="btn wpp" id="b-wpp"><svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/></svg>WhatsApp</button>
      <button class="btn" id="b-dup">Duplicar</button>
      <button class="btn danger" id="b-del">Excluir</button>
    </div></div>

  <div class="stack">
  <div class="grid-side">
      <section class="card"><div class="fields c2">
        <label class="field span2"><span>Cliente</span><div class="row-in"><select class="in" id="f-cli">${cliOptions(o.clienteId)}</select><button class="btn" id="b-ncli" type="button">+ Novo</button></div></label>
        <label class="field span2"><span>Serviço / peça</span><input class="in" data-o="titulo" value="${esc(o.titulo)}" placeholder="Ex.: Eixo do redutor — fabricação"></label>
        <label class="field"><span>Prazo de entrega</span><input class="in" data-o="prazo" value="${esc(o.prazo)}" placeholder="Ex.: 5 dias úteis"></label>
        <label class="field"><span>Referência / desenho do cliente</span><input class="in" data-o="ref" value="${esc(o.ref||'')}" placeholder="Opcional"></label>
        <label class="field"><span>Data</span><input class="in" type="date" data-o="data" value="${o.data}"></label>
        <label class="field"><span>Validade (dias)</span><input class="in" data-o="validade" inputmode="numeric" value="${o.validade}"><small id="val-ate">válido até ${dt(validoAte(o))}</small></label>
      </div></section>
    <section class="card"><h2>Resumo</h2><div class="totals">
      <div class="ln"><span>Mão de obra</span><span class="mono" id="t-mo"></span></div>
      <div class="ln"><span>Peças e materiais</span><span class="mono" id="t-pc"></span></div>
      <hr>
      <div class="ln"><span>Subtotal</span><span class="mono" id="t-sub"></span></div>
      <div class="ln"><span>Desconto</span><span class="ctl"><input class="in num" data-o="desconto" inputmode="decimal" value="${fmtP(num(o.desconto))}" placeholder="0,00"><select class="in" data-o="descTipo"><option${o.descTipo==='R$'?' selected':''}>R$</option><option${o.descTipo==='%'?' selected':''}>%</option></select></span></div>
      <div class="ln"><span>Deslocamento / frete</span><span class="ctl"><input class="in num" data-o="frete" inputmode="decimal" value="${fmtP(num(o.frete))}" placeholder="0,00"></span></div>
      <div class="big"><span>TOTAL</span><b id="t-tot"></b></div>
    </div></section>
  </div>
      <section class="card">
        <h2>Itens</h2>
        <div class="it-head"><span>Tipo</span><span>Descrição</span><span class="r">Qtd</span><span>Un</span><span class="r">Valor unit.</span><span class="r">Total</span><span></span></div>
        <div id="itens"></div>
        <div class="it-add">
          <button class="btn sm primary add-cat" data-add="cat"><svg viewBox="0 0 24 24"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6M12 12v9.2"/></svg>Escolher produto</button>
          <button class="btn sm" data-add="hora">+ Hora de máquina</button>
          <button class="btn sm" data-add="servico">+ Serviço (valor fechado)</button>
          <button class="btn sm" data-add="peca">+ Peça / material</button>
          <span class="it-sum">Total do orçamento <b class="mono" id="t-tot2"></b></span>
        </div>
      </section>
      ${formalCard(o)}
      <section class="card"><div class="fields">
        <label class="field"><span>Condições de pagamento</span><textarea class="in" data-o="pagamento" rows="2">${esc(o.pagamento)}</textarea></label>
        <label class="field"><span>Observações</span><textarea class="in" data-o="obs" rows="3">${esc(o.obs)}</textarea></label>
      </div></section>
  </div>`;

  const touch=()=>{o.atualizado=new Date().toISOString();if(save()){const s=$('#saved');s.textContent='Salvo ✓';s.classList.add('on');clearTimeout(s._t);s._t=setTimeout(()=>{s.classList.remove('on');s.textContent='Salvo automaticamente'},1200)}};
  const totals=()=>{const t=calc(o);$('#t-mo').textContent=brl(t.mo);$('#t-pc').textContent=brl(t.pc);$('#t-sub').textContent=brl(t.sub);$('#t-tot').textContent=$('#t-tot2').textContent=brl(t.total);$$('#itens .it-row').forEach(r=>{const it=o.itens[+r.dataset.i];$('.tot',r).textContent=brl(r2(num(it.qtd)*num(it.preco)))})};
  const drawItems=()=>{$('#itens').innerHTML=o.itens.length?o.itens.map(rowHTML).join(''):'<div class="it-empty">Adicione as horas de máquina, os serviços e as peças usadas.</div>';totals()};
  drawItems();

  // campos do orçamento
  $$('[data-o]',main).forEach(el=>{
    el.addEventListener('input',()=>{const k=el.dataset.o;let v=el.value;if(k==='desconto'||k==='frete')v=num(v);if(k==='validade')v=parseInt(digits(v))||0;o[k]=v;if(k==='validade'||k==='data')$('#val-ate').textContent='válido até '+dt(validoAte(o));totals();touch()});
    if(el.classList.contains('num'))el.addEventListener('blur',()=>{el.value=fmtP(num(el.value))});
  });
  $('#f-cli').onchange=e=>{o.clienteId=e.target.value;const cc=cli(o.clienteId);if(cc&&cc.formal&&!o.formal){o.formal=true;formalPadrao(o);touch();const y=scrollY;render();scrollTo(0,y);toast('Cliente com cotação formal: campos de empresa ativados');return}touch()};
  $('#f-formal').onchange=e=>{o.formal=e.target.checked;if(o.formal)formalPadrao(o);touch();const y=scrollY;render();scrollTo(0,y)};
  $('#st').onchange=e=>{o.status=e.target.value;touch();toast('Status: '+STATUS[o.status].t)};

  // itens
  const box=$('#itens');
  box.addEventListener('input',e=>{const r=e.target.closest('.it-row');if(!r)return;const it=o.itens[+r.dataset.i],k=e.target.dataset.k;it[k]=(k==='qtd'||k==='preco')?num(e.target.value):e.target.value;if(k==='tipo')r.className='it-row '+it.tipo;totals();touch()});
  box.addEventListener('change',e=>{
    const r=e.target.closest('.it-row');if(!r||e.target.dataset.k!=='desc')return;
    const it=o.itens[+r.dataset.i],c=S.catalogo.find(x=>x.ativo!==false&&x.desc.toLowerCase()===e.target.value.trim().toLowerCase());
    if(!c)return;
    Object.assign(it,{tipo:c.tipo,desc:c.desc,un:c.un,preco:c.preco,catId:c.id,cod:c.cod||'',ncm:c.ncm||''});if(!num(it.qtd))it.qtd=1;
    r.outerHTML=rowHTML(it,+r.dataset.i);totals();touch();
    $(`#itens .it-row[data-i="${o.itens.indexOf(it)}"] [data-k="qtd"]`)?.focus();
  });
  box.addEventListener('blur',e=>{const k=e.target.dataset?.k;if(k==='qtd')e.target.value=fmtQ(num(e.target.value));if(k==='preco')e.target.value=fmtP(num(e.target.value))},true);
  box.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(!d)return;o.itens.splice(+d.closest('.it-row').dataset.i,1);drawItems();touch()});
  $('.it-add').onclick=e=>{
    const b=e.target.closest('[data-add]');if(!b)return;const t=b.dataset.add;
    if(t==='cat'){pickProduto(it=>{o.itens.push(it);drawItems();touch()});return}
    o.itens.push(t==='hora'?{tipo:'servico',desc:'Hora de torno',qtd:1,un:'h',preco:num(S.cfg.valorHora)}:t==='servico'?{tipo:'servico',desc:'',qtd:1,un:'serv.',preco:0}:{tipo:'peca',desc:'',qtd:1,un:'pç',preco:0});
    drawItems();touch();
    const last=$$('#itens .it-row').pop();$(t==='hora'?'[data-k="qtd"]':'[data-k="desc"]',last).focus();
  };

  // ações
  $('#b-ncli').onclick=()=>editCliente(null,c=>{o.clienteId=c.id;$('#f-cli').innerHTML=cliOptions(c.id);touch()});
  $('#b-pdf').onclick=()=>printOrc(o);
  $('#b-send').onclick=e=>enviarPdf(o,e.currentTarget);
  $('#b-wpp').onclick=()=>whats(o);
  $('#b-dup').onclick=()=>{const n=newOrc();Object.assign(n,structuredClone({...o,id:n.id,num:n.num,ano:n.ano,data:today(),status:'aberto',criado:n.criado,demo:false}));n.titulo=(o.titulo||'')+' (cópia)';save();location.hash='#orc/'+n.id;toast('Orçamento duplicado como '+numStr(n))};
  $('#b-del').onclick=()=>{if(!confirm(`Excluir o orçamento ${numStr(o)}? Não dá para desfazer.`))return;S.orcs=S.orcs.filter(x=>x!==o);editingId=null;save();location.hash='#orcamentos';toast('Orçamento excluído')};
}

/* ================= WhatsApp ================= */
function whats(o){
  const c=cli(o.clienteId),t=calc(o);
  if(!o.itens.length){toast('Adicione pelo menos um item antes de enviar.');return}
  const linhas=o.itens.map(i=>`• ${fmtQ(num(i.qtd))} ${i.un} — ${i.desc}: ${brl(r2(num(i.qtd)*num(i.preco)))}`).join('\n');
  let msg=`Olá! Segue o orçamento nº ${numStr(o)} da *${S.cfg.nome}*${c?` para ${c.nome}`:''}.\n\n*${o.titulo||'Serviço'}*\n${linhas}\n`;
  if(t.desc)msg+=`Desconto: -${brl(t.desc)}\n`;
  if(t.frete)msg+=`Deslocamento/frete: ${brl(t.frete)}\n`;
  msg+=`\n*Total: ${brl(t.total)}*\nPrazo de entrega: ${o.prazo||'a combinar'}\nVálido até: ${dt(validoAte(o))}\nPagamento: ${(o.pagamento||'').replace(/\n/g,' ')}\n\nQualquer dúvida estou à disposição.`;
  let tel=digits(c?.tel);if(tel&&tel.length<=11)tel='55'+tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
  toast('Para mandar o PDF junto, use o botão Enviar PDF.',5000);
}

/* ================= impressão / PDF ================= */
function montaPdf(o){
  const c=cli(o.clienteId)||{},t=calc(o),g=S.cfg;
  const F=!!o.formal,CC=colCod(o),CN=colNcm(o),NCOL=5+(F?1:0)+(CC?1:0)+(CN?1:0);let _n=0;
  const grupo=(titulo,itens,sub)=>itens.length?`<tr class="grp"><td colspan="${NCOL}">${titulo}</td></tr>${itens.map(i=>`<tr>${F?`<td class="it">${String(++_n).padStart(2,'0')}</td>`:''}${CC?`<td class="cd">${esc(itCod(i))}</td>`:''}<td>${descPdf(i)}</td>${CN?`<td class="cd">${esc(itNcm(i))}</td>`:''}<td class="r m">${fmtQ(num(i.qtd))}</td><td>${esc(i.un)}</td><td class="r m">${brl(num(i.preco))}</td><td class="r m">${brl(r2(num(i.qtd)*num(i.preco)))}</td></tr>`).join('')}<tr class="sub"><td colspan="${NCOL-1}" class="r">Subtotal ${titulo.toLowerCase()}</td><td class="r m">${brl(sub)}</td></tr>`:'';

function baixarArquivo(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

function marcaBackup(){S.cfg.ultimoBackup=new Date().toISOString();save();render()}
function backupJSON(){return JSON.stringify(Object.keys(FOTOS).length?{...S,fotos:FOTOS}:S,null,1)}
async function enviarBackup(){
  const json=backupJSON(),base=`${APP_PFX}-backup-${today()}`;
  // o Chrome do Android não compartilha .json; nesse caso vai como .txt (o conteúdo é o mesmo e o Restaurar aceita)
  let file=new File([json],base+'.json',{type:'application/json'});
  if(!navigator.canShare?.({files:[file]}))file=new File([json],base+'.txt',{type:'text/plain'});
  if(navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file],title:'Backup '+APP_NOME});marcaBackup();toast('Backup enviado ✓');return}
    catch(e){if(e.name==='AbortError')return}
  }
  baixarArquivo(new Blob([json],{type:'application/json'}),base+'.json');marcaBackup();
  toast('Este aparelho não abre o compartilhar: o backup foi baixado.',5000);
}
function diasSemBackup(){const ub=S.cfg.ultimoBackup;return ub?diffDays(ub.slice(0,10),today()):null}

let h2pLoad=null;
function carregaHtml2pdf(){return h2pLoad||(h2pLoad=new Promise((ok,err)=>{if(window.html2pdf)return ok();const s=document.createElement('script');s.src='html2pdf.bundle.min.js';s.onload=()=>ok();s.onerror=()=>{h2pLoad=null;err(new Error('html2pdf'))};document.head.appendChild(s)}))}
function nomePdf(o){const c=cli(o.clienteId);return`Orcamento-${String(o.num).padStart(4,'0')}-${o.ano}${c?'-'+semAcento(c.nome).slice(0,40):''}.pdf`}
async function gerarPdf(o){
  await carregaHtml2pdf();
  try{await document.fonts.ready}catch(e){}
  const box=document.createElement('div');box.className='pdfbox';box.innerHTML=montaPdf(o);document.body.appendChild(box);
  try{
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const blob=await html2pdf().set({margin:[8,8,8,8],filename:nomePdf(o),image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(box.firstElementChild).outputPdf('blob');
    return new File([blob],nomePdf(o),{type:'application/pdf'});
  }finally{box.remove()}
}
async function compartilharPdf(o,file){
  if(navigator.canShare?.({files:[file]})){
    const dados={files:[file],title:file.name};
    if(!isIOS)dados.text=`Segue o orçamento nº ${numStr(o)} — ${S.cfg.nome}.`;
    try{await navigator.share(dados);return}
    catch(e){
      if(e.name==='AbortError')return;
      // o celular só deixa compartilhar logo depois de um toque; se o PDF demorou, pede mais um toque
      if(e.name==='NotAllowedError'){modal('PDF pronto',`<p style="margin:0">O PDF do orçamento <b>${numStr(o)}</b> está pronto.</p>`,()=>{compartilharPdf(o,file)},{okLabel:'Enviar PDF'});return}
    }
  }
  baixarArquivo(file,file.name);toast('PDF baixado. Anexe no WhatsApp ou no e-mail.',5000);
}
async function enviarPdf(o,btn){
  if(!o.itens.length){toast('Adicione pelo menos um item antes de enviar.');return}
  btn.disabled=true;toast('Gerando PDF…',15000);
  let file;
  try{file=await gerarPdf(o)}
  catch(e){console.error(e);btn.disabled=false;toast('Não consegui gerar o PDF aqui. Use o botão Imprimir.',5000);return}
  btn.disabled=false;$('#toast').classList.remove('on');
  compartilharPdf(o,file);
}

let FOTOS={},_idb=null;
function idb(){return _idb||(_idb=new Promise((ok,er)=>{const r=indexedDB.open(APP_PFX+'_fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}))}
async function idbDo(modo,fn){const db=await idb();return new Promise((ok,er)=>{const t=db.transaction('f',modo),st=t.objectStore('f');const r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>er(t.error)})}
async function fotoAll(){const db=await idb();return new Promise((ok,er)=>{const m={},t=db.transaction('f','readonly'),c=t.objectStore('f').openCursor();c.onsuccess=()=>{const k=c.result;if(k){m[k.key]=k.value;k.continue()}};t.oncomplete=()=>ok(m);t.onerror=()=>er(t.error)})}
function fotoSet(id,url){FOTOS[id]=url;return idbDo('readwrite',st=>st.put(url,id)).catch(()=>toast('Não consegui guardar a foto neste aparelho.',4000))}
function fotoDel(id){delete FOTOS[id];return idbDo('readwrite',st=>st.delete(id)).catch(()=>{})}
function fotosLimpar(){FOTOS={};return idbDo('readwrite',st=>st.clear()).catch(()=>{})}
async function fotosRestaurar(m){await fotosLimpar();for(const [k,v] of Object.entries(m||{}))await fotoSet(k,v)}
function reduzFoto(file,max=900,q=.82){return new Promise((ok,er)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',q))};im.onerror=()=>{URL.revokeObjectURL(u);er(new Error('img'))};im.src=u})}

  // campos extras
  const ex=(c.extras||[]).map(x=>({...x}));
  const drawEx=()=>{$('#p-ex').innerHTML=ex.map((x,i)=>`<div class="ex-row" data-i="${i}"><input class="in" data-k="n" value="${esc(x.n)}" placeholder="Nome do campo" aria-label="Nome do campo"><input class="in" data-k="v" value="${esc(x.v)}" placeholder="Valor" aria-label="Valor"><button class="ico-btn" type="button" data-rm title="Remover campo" aria-label="Remover campo">×</button></div>`).join('')};
  drawEx();
  $('#p-ex').addEventListener('input',e=>{const r=e.target.closest('.ex-row');if(r)ex[+r.dataset.i][e.target.dataset.k]=e.target.value});
  $('#p-ex').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;ex.splice(+b.closest('.ex-row').dataset.i,1);drawEx()});
  const addEx=n=>{ex.push({n,v:''});drawEx();const r=$$('#p-ex .ex-row').pop();$(n?'[data-k="v"]':'[data-k="n"]',r).focus()};
  $('#p-exadd').onclick=()=>addEx('');
  $('#p-exsug').onclick=e=>{const b=e.target.closest('[data-s]');if(b)addEx(b.dataset.s)};
  // salvar
  f.onsubmit=async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));
    if(!d.desc.trim()){toast('Dê um nome para o produto.');f.desc.focus();return}
    const opt=v=>String(v??'').trim()===''?null:num(v);
    Object.assign(c,{desc:d.desc.trim(),tipo:d.tipo,cat:d.cat.trim(),cod:d.cod.trim(),un:d.un.trim(),ncm:fmtNcm(d.ncm),ean:digits(d.ean),custo:num(d.custo),preco:num(d.preco),detalhe:d.detalhe.trim(),estoque:opt(d.estoque),estoqueMin:opt(d.estoqueMin),ativo:!!d.ativo,fotoPdf:!!d.fotoPdf,extras:ex.map(x=>({n:x.n.trim(),v:x.v.trim()})).filter(x=>x.n||x.v)});
    if(calc3d)Object.assign(c,{gramas:opt(d.gramas),horas:opt(d.horas),acab:opt(d.acab)});
    if(novo)S.catalogo.push(c);
    if(fotoMudou)await(foto?fotoSet(c.id,foto):fotoDel(c.id));
    save();toast('Produto salvo ✓');
    if(novo)location.replace('#produto/'+c.id);
  };
  if(novo){f.desc.focus();return}
  $('#p-orc').onclick=()=>{const o=newOrc();o.itens.push({tipo:c.tipo,desc:c.desc,qtd:1,un:c.un,preco:num(c.preco),catId:c.id});save();location.hash='#orc/'+o.id};
  $('#p-dup').onclick=async()=>{const n={...structuredClone(c),id:uid(),desc:c.desc+' (cópia)'};delete n.demo;S.catalogo.push(n);if(FOTOS[c.id])await fotoSet(n.id,FOTOS[c.id]);save();location.hash='#produto/'+n.id;toast('Produto duplicado')};
  $('#p-del').onclick=()=>{if(!confirm(`Excluir “${c.desc}”? Orçamentos já feitos não mudam.`))return;S.catalogo=S.catalogo.filter(x=>x!==c);fotoDel(c.id);save();location.hash='#catalogo';toast('Produto excluído')};
}


/* ================= cotação formal (empresas / multinacionais) ================= */
const FRETES=['CIF (por conta do fornecedor)','FOB (por conta do cliente)','Cliente retira','A combinar'];
const itCod=i=>i.cod||(i.catId&&S.catalogo.find(x=>x.id===i.catId)?.cod)||'';
const itNcm=i=>i.ncm||(i.catId&&S.catalogo.find(x=>x.id===i.catId)?.ncm)||'';
const colCod=o=>o.itens.some(i=>itCod(i));
const colNcm=o=>o.itens.some(i=>itNcm(i));
function formalPadrao(o){
  const c=cli(o.clienteId)||{},g=S.cfg;
  if(o.rev==null)o.rev=0;
  if(!o.comprador)o.comprador=c.contato||'';
  if(!o.setor)o.setor=c.setor||'';
  if(!o.freteTipo)o.freteTipo=g.freteTipo||FRETES[0];
  if(o.garantia==null)o.garantia=g.garantia||'';
  if(o.impostos==null)o.impostos=g.impostos||'';
}
function formalCard(o){
  const F=!!o.formal;
  return`<section class="card formal-card"><label class="formal-on"><input type="checkbox" id="f-formal"${F?' checked':''}><span>Cotação para empresa (formal)<small>Para multinacionais e indústrias: nº da cotação, pedido de compra, comprador, NCM, frete, impostos, garantia e dados bancários no PDF.</small></span></label>
  <div class="fields c3"${F?'':' hidden'} id="formal-f">
    <label class="field"><span>Nº da solicitação / cotação do cliente</span><input class="in" data-o="rfq" value="${esc(o.rfq||'')}" placeholder="Ex.: RFQ-45821"></label>
    <label class="field"><span>Pedido de compra (PO)</span><input class="in" data-o="po" value="${esc(o.po||'')}" placeholder="Quando o cliente aprovar"></label>
    <label class="field"><span>Revisão</span><input class="in" data-o="rev" value="${esc(o.rev??0)}" inputmode="numeric"><small>Suba quando reenviar com mudanças</small></label>
    <label class="field"><span>Comprador / contato</span><input class="in" data-o="comprador" value="${esc(o.comprador||'')}" placeholder="Nome de quem pediu"></label>
    <label class="field"><span>Setor / departamento</span><input class="in" data-o="setor" value="${esc(o.setor||'')}" placeholder="Ex.: Suprimentos, Manutenção"></label>
    <label class="field"><span>Frete</span><select class="in" data-o="freteTipo">${FRETES.map(x=>`<option${o.freteTipo===x?' selected':''}>${x}</option>`).join('')}</select></label>
    <label class="field span2"><span>Local de entrega</span><input class="in" data-o="local" value="${esc(o.local||'')}" placeholder="Endereço / planta / portaria"></label>
    <label class="field"><span>Garantia</span><input class="in" data-o="garantia" value="${esc(o.garantia||'')}" placeholder="Ex.: 90 dias"></label>
    <label class="field span3"><span>Impostos</span><input class="in" data-o="impostos" value="${esc(o.impostos||'')}" placeholder="Ex.: Preços com impostos inclusos. Empresa optante pelo Simples Nacional."></label>
  </div></section>`;
}
function formalPdf(o){
  if(!o.formal)return'';
  const g=S.cfg,L=[['Frete',o.freteTipo],['Local de entrega',o.local],['Garantia',o.garantia]].filter(x=>x[1]);
  return`<div class="h">CONDIÇÕES COMERCIAIS</div><div class="pv-fml">${L.map(([k,v])=>`<div>${k}: <b>${esc(v)}</b></div>`).join('')}</div>${o.impostos?`<div class="h">IMPOSTOS</div><p>${esc(o.impostos)}</p>`:''}${g.banco?`<div class="h">DADOS BANCÁRIOS</div><p>${esc(g.banco)}</p>`:''}`;
}


/* ================= escolher produto do cadastro (no orçamento) ================= */
function itemDoProduto(c){return{tipo:c.tipo,desc:c.desc,qtd:1,un:c.un||'',preco:num(c.preco),catId:c.id,cod:c.cod||'',ncm:c.ncm||''}}
function pickProduto(onAdd){
  const d=$('#dlg');let n=0,q='';
  const lista=()=>S.catalogo.filter(c=>c.ativo!==false&&(!q||[c.desc,c.cod,c.cat,c.ncm].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.desc.localeCompare(b.desc));
  const thumb=c=>FOTOS[c.id]?`<img class="thumb" src="${FOTOS[c.id]}" alt="">`:`<div class="thumb">${esc(iniciais(c.desc))}</div>`;
  const drawList=()=>{const r=lista();$('#pk-l',d).innerHTML=r.length?r.map(c=>`<button type="button" class="pk-row" data-id="${c.id}">${thumb(c)}<span style="min-width:0"><span class="n">${esc(c.desc)}</span><span class="s">${esc([TIPOS[c.tipo],c.cat,c.cod&&'Cód. '+c.cod].filter(Boolean).join(' · '))}</span></span><span class="p">${brl(c.preco)}<small>/${esc(c.un||'')}</small></span></button>`).join(''):`<div class="empty" style="padding:20px 8px">${S.catalogo.length?'Nenhum produto com esse nome.':'Nenhum produto cadastrado ainda.'}<br><br><button type="button" class="btn primary" data-novo>+ Cadastrar produto novo</button></div>`};
  const telaLista=()=>{
    d.innerHTML=`<div class="mdl"><header><h3>Escolher produto</h3><button type="button" class="ico-btn" data-x aria-label="Fechar">×</button></header>
      <div class="mdl-body"><div class="pk-top"><input class="in" id="pk-q" placeholder="Buscar produto…" value="${esc(q)}" autocomplete="off"><button type="button" class="btn" data-novo>+ Novo produto</button></div><div class="pk-list" id="pk-l"></div></div>
      <footer><span class="pk-count" id="pk-n">${n?`${n} item(ns) adicionado(s)`:'Toque no produto para adicionar'}</span><button type="button" class="btn primary" data-x>Pronto</button></footer></div>`;
    drawList();
    $('#pk-q',d).oninput=e=>{q=e.target.value.trim().toLowerCase();drawList()};
  };
  const telaNovo=()=>{
    d.innerHTML=`<form class="mdl" novalidate><header><h3>Cadastrar produto novo</h3><button type="button" class="ico-btn" data-x aria-label="Fechar">×</button></header>
      <div class="mdl-body"><div class="fields c2">
        <label class="field span2"><span>Nome *</span><input class="in" name="desc" value="${esc(q)}" required></label>
        <label class="field"><span>Tipo</span><select class="in" name="tipo">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}"${k===PROD_TIPO0?' selected':''}>${t}</option>`).join('')}</select></label>
        <label class="field"><span>Unidade</span><input class="in" name="un" list="dl-un" value="${esc(PROD_UN0)}"></label>
        <label class="field"><span>Preço de venda (R$)</span><input class="in num" name="preco" inputmode="decimal" placeholder="0,00"></label>
        <label class="field"><span>Código / SKU</span><input class="in" name="cod" placeholder="Opcional"></label>
        <label class="field span2"><span>NCM</span><input class="in mono" name="ncm" inputmode="numeric" placeholder="0000.00.00"></label>
      </div><p class="muted" style="font-size:13px;margin:12px 0 0">Fica salvo em Produtos e serviços. Foto, custo, estoque e campos extras dá para completar lá depois.</p></div>
      <footer><button type="button" class="btn left" data-voltar>← Lista</button><button class="btn primary">Salvar e adicionar</button></footer></form>`;
    const f=$('form',d);
    f.ncm.oninput=()=>{f.ncm.value=fmtNcm(f.ncm.value)};
    f.preco.onblur=()=>{if(f.preco.value.trim())f.preco.value=fmtP(num(f.preco.value))};
    f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.desc.trim()){toast('Dê um nome para o produto.');f.desc.focus();return}
      const c={id:uid(),desc:v.desc.trim(),tipo:v.tipo,un:v.un.trim(),preco:num(v.preco),cod:v.cod.trim(),ncm:fmtNcm(v.ncm),ativo:true,extras:[]};
      S.catalogo.push(c);save();onAdd(itemDoProduto(c));n++;q='';telaLista();toast('Produto cadastrado e adicionado')};
    f.desc.focus();
  };
  d.onclick=e=>{
    if(e.target.closest('[data-x]')){d.close();return}
    if(e.target.closest('[data-novo]')){telaNovo();return}
    if(e.target.closest('[data-voltar]')){telaLista();return}
    const r=e.target.closest('.pk-row');if(!r)return;
    const c=S.catalogo.find(x=>x.id===r.dataset.id);if(!c)return;
    onAdd(itemDoProduto(c));n++;r.classList.add('ok');$('#pk-n',d).textContent=`${n} item(ns) adicionado(s)`;
  };
  d.addEventListener('close',()=>{d.onclick=null},{once:true});
  telaLista();d.showModal();
}

// rascunhos vazios deixados ao fechar a página
S.orcs.filter(o=>!o.clienteId&&!o.itens.length&&!(o.titulo||'').trim()).forEach(o=>discardIfEmpty(o.id));
render();
</script>
